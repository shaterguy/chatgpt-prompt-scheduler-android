name: Build GPT Prompt Scheduler DEV APK
run-name: GPT Prompt Scheduler DEV (${{ github.ref_name }}) #${{ github.run_number }}

on:
  push:
    branches:
      - 'v*-dev*'

permissions:
  contents: read
  actions: read

env:
  DEV_PACKAGE: com.shaterguy.chatgptpromptscheduler.dev
  DEV_VERSION_CODE: '3000004'
  DEV_VERSION_NAME: 0.3.0-dev4
  DEV_APP_LABEL: ChatGPT Prompt Scheduler DEV
  DEV_UNSIGNED_NAME: chatgpt-prompt-scheduler-dev-v0.3.0-dev4-unsigned.apk

concurrency:
  group: chatgpt-prompt-scheduler-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
          cache-read-only: true
      - name: Test and build unsigned DEV candidate
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:assembleRelease
          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned.apk' -print -quit)"
          test -s "$UNSIGNED"
          BADGING="$($BT/aapt dump badging "$UNSIGNED")"
          grep -Fq "package: name='$DEV_PACKAGE'" <<<"$BADGING"
          grep -Fq "versionCode='$DEV_VERSION_CODE'" <<<"$BADGING"
          grep -Fq "versionName='$DEV_VERSION_NAME'" <<<"$BADGING"
          grep -Fq "application-label:'$DEV_APP_LABEL'" <<<"$BADGING"
          unzip -t "$UNSIGNED" >/dev/null
          rm -rf dev-unsigned
          mkdir -p dev-unsigned
          cp "$UNSIGNED" "dev-unsigned/$DEV_UNSIGNED_NAME"
          (
            cd dev-unsigned
            sha256sum "$DEV_UNSIGNED_NAME" > UNSIGNED_SHA256SUMS.txt
            printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT.txt
          )
      - name: Upload unsigned DEV build input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-prompt-scheduler-dev-${{ env.DEV_VERSION_NAME }}-unsigned-attempt-${{ github.run_attempt }}
          path: dev-unsigned/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload DEV unit-test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-prompt-scheduler-dev-${{ env.DEV_VERSION_NAME }}-test-reports-attempt-${{ github.run_attempt }}
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
