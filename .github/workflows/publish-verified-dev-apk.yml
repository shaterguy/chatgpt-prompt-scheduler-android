name: Publish verified DEV APK delivery

on:
  push:
    branches:
      - 'delivery/v0.3.0-dev3'
    paths:
      - '.github/workflows/publish-verified-dev-apk.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools build-tools;36.0.0'
      - name: Retrieve and verify trusted signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9492270672'
          SIGNER_RUN_ID: '32635820713'
          SOURCE_RUN_ID: '32635758003'
          SOURCE_COMMIT: '447b7be8c8174ce07c2346181903d412621ca50d'
          SIGNER_MAIN_SHA: '4ea4e8a792c2ea9e1cc7b8251453176b5a894813'
          ARTIFACT_ZIP_SHA256: '816974336ddb972bbdcfb3a055f5b1af6dc62c4bf25ec04b333cecc22906026a'
          EXPECTED_CERT_SHA256: '3cfe95acd09077a89cd8de85434cbd5d8bb3e2021d8e9eacb804a8da9ccce52a'
          APK_NAME: 'chatgpt-prompt-scheduler-dev-v0.3.0-dev3.apk'
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          require_eq() { [[ "$1" == "$2" ]] || fail "$3: expected '$2', got '$1'"; }

          require_eq "$GITHUB_REPOSITORY_ID" '1325378971' 'repository id'
          require_eq "$GITHUB_REF_NAME" 'delivery/v0.3.0-dev3' 'delivery branch'

          RUN_JSON="$RUNNER_TEMP/signer-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SIGNER_RUN_ID" > "$RUN_JSON"
          require_eq "$(jq -r '.repository.id' "$RUN_JSON")" '1325378971' 'signer repository id'
          require_eq "$(jq -r '.head_repository.id' "$RUN_JSON")" '1325378971' 'signer head repository id'
          require_eq "$(jq -r '.event' "$RUN_JSON")" 'workflow_run' 'signer event'
          require_eq "$(jq -r '.path' "$RUN_JSON")" '.github/workflows/android-dev-trusted-signer.yml' 'signer workflow path'
          require_eq "$(jq -r '.conclusion' "$RUN_JSON")" 'success' 'signer conclusion'
          require_eq "$(jq -r '.head_branch' "$RUN_JSON")" 'main' 'signer branch'
          require_eq "$(jq -r '.head_sha' "$RUN_JSON")" "$SIGNER_MAIN_SHA" 'signer main sha'
          require_eq "$(jq -r '.name' "$RUN_JSON")" "Trusted DEV signer for run $SOURCE_RUN_ID" 'signer run name'

          ARTIFACTS_JSON="$RUNNER_TEMP/signer-artifacts.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SIGNER_RUN_ID/artifacts?per_page=100" > "$ARTIFACTS_JSON"
          COUNT="$(jq '[.artifacts[] | select(.name == "chatgpt-prompt-scheduler-dev-0.3.0-dev3-signed" and (.expired | not))] | length' "$ARTIFACTS_JSON")"
          require_eq "$COUNT" '1' 'signed artifact count'
          ACTUAL_ID="$(jq -r '.artifacts[] | select(.name == "chatgpt-prompt-scheduler-dev-0.3.0-dev3-signed" and (.expired | not)) | .id' "$ARTIFACTS_JSON")"
          ACTUAL_DIGEST="$(jq -r '.artifacts[] | select(.name == "chatgpt-prompt-scheduler-dev-0.3.0-dev3-signed" and (.expired | not)) | .digest' "$ARTIFACTS_JSON")"
          require_eq "$ACTUAL_ID" "$ARTIFACT_ID" 'signed artifact id'
          require_eq "$ACTUAL_DIGEST" "sha256:$ARTIFACT_ZIP_SHA256" 'signed artifact digest'

          ARCHIVE="$RUNNER_TEMP/signed-artifact.zip"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$ARCHIVE"
          test -s "$ARCHIVE" || fail 'signed artifact download is empty'
          require_eq "$(sha256sum "$ARCHIVE" | awk '{print $1}')" "$ARTIFACT_ZIP_SHA256" 'signed artifact zip sha256'

          OUT="$RUNNER_TEMP/signed"
          mkdir -p "$OUT"
          python3 - "$ARCHIVE" "$OUT" <<'PY'
          import pathlib, stat, sys, zipfile
          archive, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive) as zf:
              infos = [i for i in zf.infolist() if not i.is_dir()]
              if not infos:
                  raise SystemExit('empty signed artifact')
              for info in infos:
                  path = pathlib.PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts or len(path.parts) != 1:
                      raise SystemExit(f'unsafe artifact path: {info.filename}')
                  if ((info.external_attr >> 16) & 0o170000) == stat.S_IFLNK:
                      raise SystemExit(f'symlink forbidden: {info.filename}')
                  if info.file_size < 1 or info.file_size > 25_000_000:
                      raise SystemExit(f'invalid artifact member size: {info.filename}={info.file_size}')
                  target = out / info.filename
                  with zf.open(info) as src, target.open('wb') as dst:
                      while chunk := src.read(1024 * 1024):
                          dst.write(chunk)
          PY

          APK="$OUT/$APK_NAME"
          test -s "$APK" || fail 'APK missing from trusted artifact'
          test -s "$OUT/SHA256SUMS.txt" || fail 'SHA256SUMS.txt missing'
          test -s "$OUT/SOURCE_COMMIT.txt" || fail 'SOURCE_COMMIT.txt missing'
          test -s "$OUT/SOURCE_RUN_ID.txt" || fail 'SOURCE_RUN_ID.txt missing'
          test -s "$OUT/DEV_SIGNING_CERT_SHA256.txt" || fail 'certificate metadata missing'
          require_eq "$(tr -d '[:space:]' < "$OUT/SOURCE_COMMIT.txt")" "$SOURCE_COMMIT" 'source commit'
          require_eq "$(tr -d '[:space:]' < "$OUT/SOURCE_RUN_ID.txt")" "$SOURCE_RUN_ID" 'source run id'
          require_eq "$(tr -d '[:space:]' < "$OUT/DEV_SIGNING_CERT_SHA256.txt")" "$EXPECTED_CERT_SHA256" 'certificate metadata'
          (cd "$OUT" && sha256sum --check --strict SHA256SUMS.txt)

          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-cert.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apk-cert.txt" || fail 'APK v2 signature verification failed'
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/apk-cert.txt" || fail 'APK v3 signature verification failed'
          CERT_SHA="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' "$RUNNER_TEMP/apk-cert.txt" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          require_eq "$CERT_SHA" "$EXPECTED_CERT_SHA256" 'APK signer certificate'
          BADGING="$($BT/aapt dump badging "$APK")"
          grep -Fq "package: name='com.shaterguy.chatgptpromptscheduler.dev'" <<<"$BADGING" || fail 'APK package mismatch'
          grep -Fq "versionCode='3000003'" <<<"$BADGING" || fail 'APK versionCode mismatch'
          grep -Fq "versionName='0.3.0-dev3'" <<<"$BADGING" || fail 'APK versionName mismatch'
          grep -Fq "application-label:'ChatGPT Prompt Scheduler DEV'" <<<"$BADGING" || fail 'APK label mismatch'
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null
          unzip -t "$APK" >/dev/null

          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          mkdir -p delivery
          cp "$APK" "delivery/$APK_NAME"
          printf '%s  %s\n' "$APK_SHA" "$APK_NAME" > "delivery/$APK_NAME.sha256"
          printf '%s\n' "$EXPECTED_CERT_SHA256" > "delivery/$APK_NAME.cert-sha256"
          printf '%s\n' "$SOURCE_COMMIT" > "delivery/$APK_NAME.source-commit"
          printf 'APK_SHA256=%s\n' "$APK_SHA"

      - name: Publish bare APK to delivery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add delivery/chatgpt-prompt-scheduler-dev-v0.3.0-dev3.apk \
                  delivery/chatgpt-prompt-scheduler-dev-v0.3.0-dev3.apk.sha256 \
                  delivery/chatgpt-prompt-scheduler-dev-v0.3.0-dev3.apk.cert-sha256 \
                  delivery/chatgpt-prompt-scheduler-dev-v0.3.0-dev3.apk.source-commit
          git diff --cached --check
          mapfile -t CHANGED < <(git diff --cached --name-only | sort)
          EXPECTED=(
            'delivery/chatgpt-prompt-scheduler-dev-v0.3.0-dev3.apk'
            'delivery/chatgpt-prompt-scheduler-dev-v0.3.0-dev3.apk.cert-sha256'
            'delivery/chatgpt-prompt-scheduler-dev-v0.3.0-dev3.apk.sha256'
            'delivery/chatgpt-prompt-scheduler-dev-v0.3.0-dev3.apk.source-commit'
          )
          [[ "${#CHANGED[@]}" -eq "${#EXPECTED[@]}" ]]
          for i in "${!EXPECTED[@]}"; do [[ "${CHANGED[$i]}" == "${EXPECTED[$i]}" ]]; done
          git commit -m 'Publish verified 0.3.0-dev3 APK for direct testing'
          git push origin HEAD:"$GITHUB_REF_NAME"
