name: Build and Release Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '.github/release-selftest-report.json'
      - '.github/artifact-maintenance-report.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Build unsigned release APK
        if: steps.unit_tests.outcome == 'success'
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Upload unit-test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-prompt-scheduler-android-v0.1.13-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
      - name: Stop on unit-test failure
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1

  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      APK_NAME: chatgpt-prompt-scheduler-android-v0.1.13.apk
      SOURCE_NAME: chatgpt-prompt-scheduler-android-v0.1.13-source.zip
      PACKAGE_NAME: com.shaterguy.chatgptpromptscheduler
      VERSION_CODE: '14'
      VERSION_NAME: '0.1.13'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build and self-sign reinstall-only release APK
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE=/tmp/chatgpt-prompt-scheduler-reinstall-only.jks
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_ALIAS=chatgpt-prompt-scheduler-reinstall-only
          echo "::add-mask::$STORE_PASSWORD"
          trap 'rm -f "$KEYSTORE"' EXIT

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname 'CN=ChatGPT Prompt Scheduler Reinstall Only,O=Personal Android Build,C=KR'

          gradle --no-daemon --stacktrace :app:assembleRelease
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk dist/app-aligned.apk
          "$BT/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$STORE_PASSWORD" \
            --out "dist/$APK_NAME" \
            dist/app-aligned.apk
          rm dist/app-aligned.apk

          "$BT/apksigner" verify --verbose --print-certs "dist/$APK_NAME" | tee dist/SIGNING_CERTIFICATE.txt
          unzip -t "dist/$APK_NAME" >/dev/null
          (cd dist && sha256sum "$APK_NAME" > SHA256SUMS.txt)
          git archive --format=zip --output="dist/$SOURCE_NAME" HEAD
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: chatgpt-prompt-scheduler-android-v0.1.13-reinstall-only
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v0.1.13 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create v0.1.13 \
            "dist/$APK_NAME" \
            "dist/$SOURCE_NAME" \
            dist/SHA256SUMS.txt \
            dist/SIGNING_CERTIFICATE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'ChatGPT Prompt Scheduler Android v0.1.13' \
            --notes '개인용 공개 빌드입니다. 실행 시 생성되는 임시 서명키로 서명되므로 기존 앱을 삭제한 뒤 설치하세요.'
      - name: Read back and verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/release-readback
          mkdir -p /tmp/release-readback
          cd /tmp/release-readback
          gh release download v0.1.13 --repo "$GITHUB_REPOSITORY" --pattern "$APK_NAME"
          gh release download v0.1.13 --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_NAME"
          gh release download v0.1.13 --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
          unzip -t "$SOURCE_NAME" >/dev/null
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK_NAME" > "$GITHUB_WORKSPACE/release-signature-readback.txt"
          "$BT/aapt" dump badging "$APK_NAME" > "$GITHUB_WORKSPACE/release-badging-readback.txt"
          grep -q "package: name='$PACKAGE_NAME'" "$GITHUB_WORKSPACE/release-badging-readback.txt"
          grep -q "versionCode='$VERSION_CODE'" "$GITHUB_WORKSPACE/release-badging-readback.txt"
          grep -q "versionName='$VERSION_NAME'" "$GITHUB_WORKSPACE/release-badging-readback.txt"
      - name: Record public release self-test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .github
          cat > .github/release-selftest-report.json <<EOF
          {
            "repository": "$GITHUB_REPOSITORY",
            "run_id": "$GITHUB_RUN_ID",
            "source_sha": "$GITHUB_SHA",
            "release_tag": "v0.1.13",
            "mode": "reinstall-only-ephemeral-signing",
            "unit_tests": "success",
            "signed_apk": "verified",
            "release_readback": "verified",
            "external_private_repo_dependency": false,
            "repository_secrets_required": false,
            "completed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-selftest-report.json
          git commit -m 'Record public release self-test'
          git push
