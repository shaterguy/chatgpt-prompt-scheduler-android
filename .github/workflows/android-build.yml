name: Build and Release Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '.github/release-selftest-report.json'
      - '.github/release-selftest-jobs.json'
      - '.github/artifact-maintenance-report.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Build unsigned release APK
        if: steps.unit_tests.outcome == 'success'
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Upload trusted pre-release candidate input
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/autorun-history-logs-v0.1.20' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v0.1.20-unsigned-candidate-input
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 2
      - name: Upload unit-test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-prompt-scheduler-android-v0.1.20-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
      - name: Stop on unit-test failure
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1

  pre_release_candidate:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/autorun-history-logs-v0.1.20' && github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      APK_NAME: chatgpt-prompt-scheduler-android-v0.1.20-candidate.apk
      PACKAGE_NAME: com.shaterguy.chatgptpromptscheduler
      VERSION_CODE: '21'
      OLD_VERSION_CODE: '20'
      EXPECTED_PUBLIC_CERT_SHA256: '3cfe95acd09077a89cd8de85434cbd5d8bb3e2021d8e9eacb804a8da9ccce52a'
    steps:
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'build-tools;36.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v0.1.20-unsigned-candidate-input
          path: candidate-input
      - name: Sign trusted device-test candidate
        shell: bash
        env:
          SIGNING_BUNDLE_BASE64: ${{ secrets.CHATGPT_PUBLIC_SIGNING_BUNDLE_BASE64 }}
        run: |
          set -euo pipefail
          trap 'rm -rf /tmp/public-signing' EXIT
          test -n "$SIGNING_BUNDLE_BASE64"
          mkdir -p /tmp/public-signing dist
          printf '%s' "$SIGNING_BUNDLE_BASE64" | base64 --decode > /tmp/public-signing/bundle.tar.gz
          tar -xzf /tmp/public-signing/bundle.tar.gz -C /tmp/public-signing
          ACTUAL="$(openssl x509 -in /tmp/public-signing/cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$ACTUAL" = "$EXPECTED_PUBLIC_CERT_SHA256"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -p -f 4 candidate-input/app-release-unsigned.apk dist/app-aligned.apk
          "$BT/apksigner" sign --key /tmp/public-signing/key.pk8 --cert /tmp/public-signing/cert.pem --out "dist/$APK_NAME" dist/app-aligned.apk
          rm dist/app-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "dist/$APK_NAME" | tee dist/SIGNING_CERTIFICATE.txt
          grep -qi "$EXPECTED_PUBLIC_CERT_SHA256" dist/SIGNING_CERTIFICATE.txt
          "$BT/aapt" dump badging "dist/$APK_NAME" | tee dist/badging.txt
          grep -q "package: name='$PACKAGE_NAME' versionCode='$VERSION_CODE'" dist/badging.txt
          (cd dist && sha256sum "$APK_NAME" > SHA256SUMS.txt)
      - name: Verify v0.1.19 update compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/update-baseline
          gh release download v0.1.19 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir /tmp/update-baseline
          OLD_APK="$(find /tmp/update-baseline -maxdepth 1 -type f -name '*.apk' -print -quit)"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging "$OLD_APK" > /tmp/update-baseline/old-badging.txt
          grep -q "package: name='$PACKAGE_NAME' versionCode='$OLD_VERSION_CODE'" /tmp/update-baseline/old-badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$OLD_APK" > /tmp/update-baseline/old-signature.txt
          grep -qi "$EXPECTED_PUBLIC_CERT_SHA256" /tmp/update-baseline/old-signature.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-prompt-scheduler-android-v0.1.20-device-test-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      APK_NAME: chatgpt-prompt-scheduler-android-v0.1.20.apk
      SOURCE_NAME: chatgpt-prompt-scheduler-android-v0.1.20-source.zip
      PACKAGE_NAME: com.shaterguy.chatgptpromptscheduler
      VERSION_CODE: '21'
      VERSION_NAME: '0.1.20'
      OLD_VERSION_CODE: '20'
      EXPECTED_PUBLIC_CERT_SHA256: '3cfe95acd09077a89cd8de85434cbd5d8bb3e2021d8e9eacb804a8da9ccce52a'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check immutable release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.20 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Build unsigned release before restoring signing identity
        if: steps.release_state.outputs.exists != 'true'
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Sign with persistent public identity
        if: steps.release_state.outputs.exists != 'true'
        shell: bash
        env:
          SIGNING_BUNDLE_BASE64: ${{ secrets.CHATGPT_PUBLIC_SIGNING_BUNDLE_BASE64 }}
        run: |
          set -euo pipefail
          trap 'rm -rf /tmp/public-signing' EXIT
          test -n "$SIGNING_BUNDLE_BASE64"
          rm -rf /tmp/public-signing
          mkdir -p /tmp/public-signing
          printf '%s' "$SIGNING_BUNDLE_BASE64" | base64 --decode > /tmp/public-signing/bundle.tar.gz
          tar -xzf /tmp/public-signing/bundle.tar.gz -C /tmp/public-signing
          test -s /tmp/public-signing/key.pk8
          test -s /tmp/public-signing/cert.pem
          ACTUAL="$(openssl x509 -in /tmp/public-signing/cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$ACTUAL" = "$EXPECTED_PUBLIC_CERT_SHA256"
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk dist/app-aligned.apk
          "$BT/apksigner" sign \
            --key /tmp/public-signing/key.pk8 \
            --cert /tmp/public-signing/cert.pem \
            --out "dist/$APK_NAME" \
            dist/app-aligned.apk
          rm dist/app-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "dist/$APK_NAME" | tee dist/SIGNING_CERTIFICATE.txt
          grep -qi "$EXPECTED_PUBLIC_CERT_SHA256" dist/SIGNING_CERTIFICATE.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/SIGNING_CERTIFICATE.txt
          unzip -t "dist/$APK_NAME" >/dev/null
          (cd dist && sha256sum "$APK_NAME" > SHA256SUMS.txt)
          git archive --format=zip --output="dist/$SOURCE_NAME" HEAD
      - name: Verify installed-public-version update compatibility
        if: steps.release_state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/update-baseline
          mkdir -p /tmp/update-baseline
          gh release download v0.1.19 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir /tmp/update-baseline
          OLD_APK="$(find /tmp/update-baseline -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$OLD_APK"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging "$OLD_APK" > /tmp/update-baseline/old-badging.txt
          grep -q "package: name='$PACKAGE_NAME'" /tmp/update-baseline/old-badging.txt
          grep -q "versionCode='$OLD_VERSION_CODE'" /tmp/update-baseline/old-badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$OLD_APK" > /tmp/update-baseline/old-signature.txt
          grep -qi "$EXPECTED_PUBLIC_CERT_SHA256" /tmp/update-baseline/old-signature.txt
          test "$OLD_VERSION_CODE" -lt "$VERSION_CODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.release_state.outputs.exists != 'true'
        continue-on-error: true
        with:
          name: chatgpt-prompt-scheduler-android-v0.1.20-public-signed
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish release
        if: steps.release_state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.1.20 \
            "dist/$APK_NAME" \
            "dist/$SOURCE_NAME" \
            dist/SHA256SUMS.txt \
            dist/SIGNING_CERTIFICATE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'ChatGPT Prompt Scheduler Android v0.1.20' \
            --notes-file RELEASE_NOTES-v0.1.20.md
      - name: Read back and verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/release-readback
          mkdir -p /tmp/release-readback
          cd /tmp/release-readback
          gh release download v0.1.20 --repo "$GITHUB_REPOSITORY" --pattern "$APK_NAME"
          gh release download v0.1.20 --repo "$GITHUB_REPOSITORY" --pattern "$SOURCE_NAME"
          gh release download v0.1.20 --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
          unzip -t "$SOURCE_NAME" >/dev/null
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK_NAME" > "$GITHUB_WORKSPACE/release-signature-readback.txt"
          grep -qi "$EXPECTED_PUBLIC_CERT_SHA256" "$GITHUB_WORKSPACE/release-signature-readback.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$GITHUB_WORKSPACE/release-signature-readback.txt"
          "$BT/aapt" dump badging "$APK_NAME" > "$GITHUB_WORKSPACE/release-badging-readback.txt"
          grep -q "package: name='$PACKAGE_NAME'" "$GITHUB_WORKSPACE/release-badging-readback.txt"
          grep -q "versionCode='$VERSION_CODE'" "$GITHUB_WORKSPACE/release-badging-readback.txt"
          grep -q "versionName='$VERSION_NAME'" "$GITHUB_WORKSPACE/release-badging-readback.txt"
