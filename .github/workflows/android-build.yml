name: Build and Release Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Build unsigned release APK
        if: steps.unit_tests.outcome == 'success'
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Upload unit-test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-prompt-scheduler-android-v0.1.13-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
      - name: Stop on unit-test failure
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1

  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build and self-sign reinstall-only release APK
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE=/tmp/chatgpt-prompt-scheduler-reinstall-only.jks
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_ALIAS=chatgpt-prompt-scheduler-reinstall-only
          echo "::add-mask::$STORE_PASSWORD"
          trap 'rm -f "$KEYSTORE"' EXIT

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname 'CN=ChatGPT Prompt Scheduler Reinstall Only,O=Personal Android Build,C=KR'

          gradle --no-daemon --stacktrace :app:assembleRelease
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk dist/app-aligned.apk
          "$BT/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$STORE_PASSWORD" \
            --out dist/chatgpt-prompt-scheduler-android-v0.1.13.apk \
            dist/app-aligned.apk
          rm dist/app-aligned.apk

          "$BT/apksigner" verify --verbose --print-certs dist/chatgpt-prompt-scheduler-android-v0.1.13.apk | tee dist/SIGNING_CERTIFICATE.txt
          unzip -t dist/chatgpt-prompt-scheduler-android-v0.1.13.apk
          sha256sum dist/chatgpt-prompt-scheduler-android-v0.1.13.apk > dist/SHA256SUMS.txt
          sha256sum -c dist/SHA256SUMS.txt
          zip -qr dist/chatgpt-prompt-scheduler-android-v0.1.13-source.zip . \
            -x '.git/*' '*/build/*' 'dist/*' '*.jks' '*.keystore'
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: chatgpt-prompt-scheduler-android-v0.1.13-reinstall-only
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v0.1.13 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create v0.1.13 \
            dist/chatgpt-prompt-scheduler-android-v0.1.13.apk \
            dist/chatgpt-prompt-scheduler-android-v0.1.13-source.zip \
            dist/SHA256SUMS.txt \
            dist/SIGNING_CERTIFICATE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'ChatGPT Prompt Scheduler Android v0.1.13' \
            --notes '개인용 공개 빌드입니다. 이 APK는 실행 시 생성되는 임시 서명키로 서명되므로 이전 설치본 위에 업데이트하지 말고 기존 앱을 삭제한 뒤 설치하세요.'
