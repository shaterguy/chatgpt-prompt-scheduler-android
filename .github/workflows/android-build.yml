name: Build and Release Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SIGNING_KEY_ALIAS: chatgpt-prompt-scheduler

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Build unsigned release APK
        if: steps.unit_tests.outcome == 'success'
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Upload unit-test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-prompt-scheduler-android-v0.1.13-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
      - name: Stop on unit-test failure
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore signing key from repository secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > /tmp/upload.jks
          echo 'e92d5df128afcc039b902afa643ea4836364e5b2a7f4be0e7d44c95a71cb466b  /tmp/upload.jks' | sha256sum -c -
      - name: Build and sign release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/upload.jks' EXIT
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :app:assembleRelease
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk dist/app-aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/upload.jks \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --out dist/chatgpt-prompt-scheduler-android-v0.1.13.apk \
            dist/app-aligned.apk
          rm dist/app-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs dist/chatgpt-prompt-scheduler-android-v0.1.13.apk | tee dist/SIGNING_CERTIFICATE.txt
          grep -qi '172dc1f21f1d1d4aaf8b22ff84a4084dbfd531f5ecfacae8fcf374b1beb4466e' dist/SIGNING_CERTIFICATE.txt
          unzip -t dist/chatgpt-prompt-scheduler-android-v0.1.13.apk
          sha256sum dist/chatgpt-prompt-scheduler-android-v0.1.13.apk > dist/SHA256SUMS.txt
          sha256sum -c dist/SHA256SUMS.txt
          zip -qr dist/chatgpt-prompt-scheduler-android-v0.1.13-source.zip . \
            -x '.git/*' '*/build/*' 'dist/*' '.android-signing/*' '*.jks' '*.keystore' 'signing-secrets*'
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: chatgpt-prompt-scheduler-android-v0.1.13-signed
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1.13 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create v0.1.13 \
            dist/chatgpt-prompt-scheduler-android-v0.1.13.apk \
            dist/chatgpt-prompt-scheduler-android-v0.1.13-source.zip \
            dist/SHA256SUMS.txt \
            dist/SIGNING_CERTIFICATE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'ChatGPT Prompt Scheduler Android v0.1.13' \
            --notes-file RELEASE_NOTES-v0.1.13.md
