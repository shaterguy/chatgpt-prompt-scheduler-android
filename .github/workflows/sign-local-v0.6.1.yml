name: Sign pinned local scheduler v0.6.1
on:
  push:
    branches: ['ops/sign-local-v0.6.1-20261102']
permissions:
  contents: write
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: shaterguy/chatgpt-prompt-scheduler-android
      EXPECTED_CERT: 3cfe95acd09077a89cd8de85434cbd5d8bb3e2021d8e9eacb804a8da9ccce52a
    steps:
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'build-tools;36.0.0'
      - name: Verify exact local build input
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view v0.6.1 --json isDraft --jq .isDraft)" = true
          test "$(gh release view v0.6.1 --json targetCommitish --jq .targetCommitish)" = 01208ef35a2e4695e8d2e44fc41db0470989f227
          mkdir -p input dist
          gh release download v0.6.1 --pattern '*-unsigned.apk' --dir input
          echo '3473494cab011eff47a77735c50f2184c19972465a0520f0bbae8e39ffc4d2e1  input/chatgpt-prompt-scheduler-android-v0.6.1-unsigned.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging input/*-unsigned.apk > input/badging.txt
          grep -q "package: name='com.shaterguy.chatgptpromptscheduler' versionCode='2100000013' versionName='0.6.1'" input/badging.txt
          grep -q "application-label:'ChatGPT Prompt Scheduler'" input/badging.txt
      - name: Sign only verified APK
        shell: bash
        env:
          SIGNING_BUNDLE_BASE64: ${{ secrets.CHATGPT_PUBLIC_SIGNING_BUNDLE_BASE64 }}
        run: |
          set -euo pipefail
          keydir="$(mktemp -d)"
          trap 'rm -rf "$keydir"' EXIT
          test -n "$SIGNING_BUNDLE_BASE64"
          printf '%s' "$SIGNING_BUNDLE_BASE64" | base64 --decode > "$keydir/bundle.tar.gz"
          tar -xzf "$keydir/bundle.tar.gz" -C "$keydir"
          actual="$(openssl x509 -in "$keydir/cert.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$actual" = "$EXPECTED_CERT"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/zipalign" -p -f 4 input/chatgpt-prompt-scheduler-android-v0.6.1-unsigned.apk input/aligned.apk
          "$bt/apksigner" sign --key "$keydir/key.pk8" --cert "$keydir/cert.pem" --out dist/chatgpt-prompt-scheduler-android-v0.6.1.apk input/aligned.apk
          "$bt/apksigner" verify --verbose --print-certs dist/*.apk > dist/SIGNING_CERTIFICATE.txt
          grep -qi "$EXPECTED_CERT" dist/SIGNING_CERTIFICATE.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/SIGNING_CERTIFICATE.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' dist/SIGNING_CERTIFICATE.txt
          unzip -t dist/*.apk > /dev/null
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Attach signed output to draft only
        run: gh release upload v0.6.1 dist/* 
