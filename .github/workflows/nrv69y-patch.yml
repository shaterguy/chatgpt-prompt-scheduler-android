name: NRV69Y Patch And Verify
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/nrv69y-resume-target-v0.1.22'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Apply NRV69Y recovery patch
        run: |
          set -euo pipefail
          cat tools/nrv69y_patch_parts/[0-9][0-9].b64 | tr -d '\n' | base64 -d > /tmp/nrv69y_patch.py
          test "$(wc -c < /tmp/nrv69y_patch.py)" -gt 60000
          echo 'a86607e5a0459cb7dd272f8f7f393fa6fd377ddf619345bb01917f0c20876dec  /tmp/nrv69y_patch.py' | sha256sum -c -
          python /tmp/nrv69y_patch.py
      - name: Diff check
        run: git diff --check
      - name: Unit tests
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Build release
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleRelease
      - name: Commit verified patch to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java app/src/test/java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix scheduler Work mode and autorun recovery'
          git push origin HEAD:${{ github.head_ref }}
