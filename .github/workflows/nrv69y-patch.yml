name: SKBHDS RC6 WAITING_USER Resume Fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-and-test:
    if: github.head_ref == 'fix/skbhds-rc4-recovery-followup'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Apply RC6 WAITING_USER resume fix
        run: |
          set -euo pipefail
          python tools/skbhds_rc6_waiting_user_resume_fix.py
          git diff --check
      - name: Unit tests
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Release build
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleRelease
      - name: Commit tested RC6 source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle \
            app/src/main/java/com/shaterguy/chatgptpromptscheduler/OrchestrationActivity.java \
            app/src/test/java/com/shaterguy/chatgptpromptscheduler/UnifiedResumeTest.java \
            app/src/test/java/com/shaterguy/chatgptpromptscheduler/Rc6WaitingUserResumeRegressionTest.java
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'RC6 source already materialized'
          else
            git commit -m 'Fix WAITING_USER resume routing for RC6'
            git push origin HEAD:${{ github.head_ref }}
          fi
