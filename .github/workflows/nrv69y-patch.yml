name: NRV69Y Patch And Verify
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/nrv69y-resume-target-v0.1.22'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Apply and materialize NRV69Y recovery patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if grep -q 'ConversationTargetState' app/src/main/java/com/shaterguy/chatgptpromptscheduler/TargetParser.java; then
            echo 'NRV69Y source already materialized; skipping patch scripts.'
          else
            rm -f tools/nrv69y_patch_error.txt
            set +e
            python tools/nrv69y_patch_plain1.py > /tmp/patch1.log 2>&1
            rc1=$?
            if [ "$rc1" -eq 0 ]; then
              python tools/nrv69y_patch_plain2.py > /tmp/patch2.log 2>&1
              rc2=$?
            else
              rc2=0
            fi
            set -e
            if [ "$rc1" -ne 0 ] || [ "$rc2" -ne 0 ]; then
              { echo "PATCH1_RC=$rc1"; cat /tmp/patch1.log; echo "PATCH2_RC=$rc2"; cat /tmp/patch2.log; } > tools/nrv69y_patch_error.txt
              git add tools/nrv69y_patch_error.txt
              if ! git diff --cached --quiet; then
                git commit -m 'Record NRV69Y readable patch failure'
                git push origin HEAD:${{ github.head_ref }}
              fi
              exit 1
            fi
            git diff --check
            git add app/src/main/java app/src/test/java tools/nrv69y_patch_error.txt || true
            if ! git diff --cached --quiet; then
              git commit -m 'Materialize NRV69Y recovery patch'
              git push origin HEAD:${{ github.head_ref }}
            fi
          fi
      - name: Diff check
        run: git diff --check
      - name: Unit tests with persisted failure log
        run: |
          set +e
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest > /tmp/unit.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            tail -n 500 /tmp/unit.log > tools/nrv69y_unit_failure.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tools/nrv69y_unit_failure.txt
            if ! git diff --cached --quiet; then
              git commit -m 'Record NRV69Y unit test failure'
              git push origin HEAD:${{ github.head_ref }}
            fi
            cat /tmp/unit.log
            exit "$rc"
          fi
          rm -f tools/nrv69y_unit_failure.txt
      - name: Build release
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleRelease
