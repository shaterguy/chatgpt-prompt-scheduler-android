name: NRV69Y Patch And Verify
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'fix/nrv69y-resume-target-v0.1.22'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - id: patch
        name: Apply NRV69Y recovery patch
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/nrv69y-diag
          if grep -q 'ConversationTargetState' app/src/main/java/com/shaterguy/chatgptpromptscheduler/TargetParser.java; then
            echo 'already materialized' > /tmp/nrv69y-diag/patch.log
            echo 'ok=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tools/nrv69y_patch_plain1.py > /tmp/nrv69y-diag/patch1.log 2>&1
          rc1=$?
          rc2=0
          if [ "$rc1" -eq 0 ]; then
            python tools/nrv69y_patch_plain2.py > /tmp/nrv69y-diag/patch2.log 2>&1
            rc2=$?
          fi
          echo "rc1=$rc1 rc2=$rc2" > /tmp/nrv69y-diag/status.txt
          git diff --check > /tmp/nrv69y-diag/diffcheck.txt 2>&1
          diff_rc=$?
          if [ "$rc1" -eq 0 ] && [ "$rc2" -eq 0 ] && [ "$diff_rc" -eq 0 ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nrv69y-patch-diagnostics
          path: /tmp/nrv69y-diag/**
          if-no-files-found: warn
          retention-days: 7
      - name: Commit materialized source
        if: steps.patch.outputs.ok == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java app/src/test/java
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize NRV69Y recovery patch'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Unit tests
        if: steps.patch.outputs.ok == 'true'
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Build release
        if: steps.patch.outputs.ok == 'true'
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleRelease
      - name: Fail if patch failed
        if: steps.patch.outputs.ok != 'true'
        run: exit 1
