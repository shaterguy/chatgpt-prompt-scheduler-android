name: Apply SKBHDS RC5 recovery patch on PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'fix/skbhds-rc4-recovery-followup' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/skbhds-rc4-recovery-followup
          fetch-depth: 0
      - name: Extract and apply the fail-closed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-skbhds-rc5-fix.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = [line[10:] if line.startswith('          ') else line for line in source[start:end]]

          mismatch = [i for i, line in enumerate(body) if line.strip() == 'if actual != count:']
          if len(mismatch) != 1:
              raise SystemExit(f'expected one generic replace mismatch guard, found {len(mismatch)}')
          i = mismatch[0]
          if i + 1 >= len(body) or 'raise SystemExit' not in body[i + 1]:
              raise SystemExit('generic replace mismatch guard shape changed')
          indent = body[i][:len(body[i]) - len(body[i].lstrip())]
          raise_expr = body[i + 1].lstrip()
          body[i:i + 2] = [
              indent + 'if actual != count:',
              indent + "    approved = ('RESUME_ROOM_SCAN_META' in old or 'case WAIT_FOR_IDLE' in old",
              indent + "            or 'case \\\"TARGET_CONTEXT_MISMATCH\\\", \\\"NETWORK_ERROR\\\"' in old",
              indent + "            or ('AUTH_REQUIRED' in old and 'NETWORK_ERROR' in old and 'DOM_STRUCTURE_ERROR' in old))",
              indent + '    if approved:',
              indent + "        print('SKIP_APPROVED_EXACT_REPLACE')",
              indent + '        return',
              indent + '    ' + raise_expr,
          ]
          Path('/tmp/apply_rc5.py').write_text('\n'.join(body) + '\n')
          PY
          python3 /tmp/apply_rc5.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/shaterguy/chatgptpromptscheduler/OrchestrationService.java')
          text = path.read_text()

          old_wait = '''            case WAIT_FOR_IDLE -> {
                log("RESUME_WAITING_FOR_IDLE", "side=both;reason=" + safeCode(decision.reason)
                        + ";retry=" + store.pollCountLong());
                if ("NO_VALID_SIGNAL".equals(decision.reason)
                        && store.pollCountLong() >= MAX_NO_SIGNAL_RECONCILIATION_RETRIES) {
                    pauseReconciliationError("RESUME_NO_VALID_SIGNAL",
                            "두 대화방을 반복 확인했지만 최신 Protocol 제어 신호를 찾지 못했습니다.");
                    return;
                }
                restartReconciliation(decision.reason, true);
                scheduleReconciliationRetry(decision.reason);
            }'''
          new_wait = '''            case WAIT_FOR_IDLE -> {
                log("RESUME_WAITING_FOR_IDLE", "side=both;reason=" + safeCode(decision.reason)
                        + ";retry=" + store.pollCountLong());
                if ("NO_VALID_SIGNAL".equals(decision.reason)) {
                    reconciliationRescanAttempts++;
                    log("RESUME_NO_SIGNAL_RETRY", "attempt=" + reconciliationRescanAttempts);
                    if (reconciliationRescanAttempts >= MAX_NO_SIGNAL_RECONCILIATION_RETRIES) {
                        pauseReconciliationError("RESUME_NO_VALID_SIGNAL",
                                "대화 이력 로딩이 확인된 뒤에도 두 대화방에서 최신 Protocol 제어 신호를 찾지 못했습니다.");
                        return;
                    }
                } else {
                    reconciliationRescanAttempts = 0;
                }
                restartReconciliation(decision.reason, true);
                scheduleReconciliationRetry(decision.reason);
            }'''
          if old_wait not in text:
              raise SystemExit('actual WAIT_FOR_IDLE block changed')
          text = text.replace(old_wait, new_wait, 1)

          old_stop = '''            case "TARGET_CONTEXT_MISMATCH", "NETWORK_ERROR" ->
                    pauseWithError(status, fixedScriptMessage(status));'''
          new_stop = '''            case "NETWORK_ERROR" -> recoverTransientNetwork("STOP_GENERATION_SCRIPT");
            case "TARGET_CONTEXT_MISMATCH" -> pauseWithError(status, fixedScriptMessage(status));'''
          if old_stop not in text:
              raise SystemExit('actual STOP_GENERATION network case changed')
          text = text.replace(old_stop, new_stop, 1)

          old_observe_inner = '''            if ("AUTH_REQUIRED".equals(status) || "NETWORK_ERROR".equals(status)
                    || "DOM_STRUCTURE_ERROR".equals(status) || "TARGET_CONTEXT_MISMATCH".equals(status)) {
                pauseWithError(status, fixedScriptMessage(status));
                return;
            }'''
          new_observe_inner = '''            if ("NETWORK_ERROR".equals(status)) {
                recoverTransientNetwork("OBSERVE_SCRIPT");
                return;
            }
            if ("AUTH_REQUIRED".equals(status)
                    || "DOM_STRUCTURE_ERROR".equals(status) || "TARGET_CONTEXT_MISMATCH".equals(status)) {
                pauseWithError(status, fixedScriptMessage(status));
                return;
            }'''
          if text.count(old_observe_inner) != 1:
              raise SystemExit(f'expected one inner observation network block, found {text.count(old_observe_inner)}')
          text = text.replace(old_observe_inner, new_observe_inner, 1)

          old_observe_outer = '''        if ("AUTH_REQUIRED".equals(status) || "NETWORK_ERROR".equals(status)
                || "DOM_STRUCTURE_ERROR".equals(status) || "TARGET_CONTEXT_MISMATCH".equals(status)) {
            pauseWithError(status, fixedScriptMessage(status));
            return;
        }'''
          new_observe_outer = '''        if ("NETWORK_ERROR".equals(status)) {
            recoverTransientNetwork("OBSERVE_SCRIPT");
            return;
        }
        if ("AUTH_REQUIRED".equals(status)
                || "DOM_STRUCTURE_ERROR".equals(status) || "TARGET_CONTEXT_MISMATCH".equals(status)) {
            pauseWithError(status, fixedScriptMessage(status));
            return;
        }'''
          if text.count(old_observe_outer) != 1:
              raise SystemExit(f'expected one outer observation network block, found {text.count(old_observe_outer)}')
          text = text.replace(old_observe_outer, new_observe_outer, 1)
          path.write_text(text)

          lines = path.read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if 'log("RESUME_ROOM_SCAN_META", "side=" + safeCode(side)' in line]
          if len(starts) != 1:
              raise SystemExit(f'expected one RESUME_ROOM_SCAN_META log, found {len(starts)}')
          i = starts[0]
          nearby = '\n'.join(lines[i:i + 10])
          if 'history_ready=' not in nearby:
              lines.insert(i + 1, '                + ";history_ready=" + (result.optBoolean("history_ready", false) ? "1" : "0")')
          assistant = next((j for j in range(i + 1, min(i + 10, len(lines))) if ';assistant_turns=' in lines[j]), None)
          if assistant is None:
              raise SystemExit('assistant_turns line not found near RESUME_ROOM_SCAN_META')
          nearby = '\n'.join(lines[i:i + 12])
          if 'job_prompt_turns=' not in nearby:
              lines.insert(assistant + 1, '                + ";job_prompt_turns=" + Math.max(0, result.optInt("job_prompt_turns", 0))')
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Diff checks
        run: |
          git diff --check
          grep -q "versionCode 27" app/build.gradle
          grep -q "versionName '0.1.22-rc5'" app/build.gradle
          grep -q 'SIGNAL_RETRY_EXHAUSTED' app/src/main/java/com/shaterguy/chatgptpromptscheduler/OrchestrationService.java
          grep -q 'history_ready:false' app/src/main/java/com/shaterguy/chatgptpromptscheduler/OrchestrationScript.java
          grep -q 'history_ready=' app/src/main/java/com/shaterguy/chatgptpromptscheduler/OrchestrationService.java
          grep -q 'reconciliationRescanAttempts++' app/src/main/java/com/shaterguy/chatgptpromptscheduler/OrchestrationService.java
          grep -q 'recoverTransientNetwork("STOP_GENERATION_SCRIPT")' app/src/main/java/com/shaterguy/chatgptpromptscheduler/OrchestrationService.java
          test "$(grep -c 'recoverTransientNetwork("OBSERVE_SCRIPT")' app/src/main/java/com/shaterguy/chatgptpromptscheduler/OrchestrationService.java)" -ge 2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Unsigned release build
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleRelease
      - name: Security screening
        shell: bash
        run: |
          set -euo pipefail
          git diff -- app/src/main app/build.gradle .github/workflows/rc-apk.yml > /tmp/rc5.diff
          ! grep -E 'BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,}' /tmp/rc5.diff
          test "$(git diff -- app/src/main/AndroidManifest.xml | wc -c)" -eq 0
      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-skbhds-rc5-fix.yml .github/workflows/apply-skbhds-rc5-fix-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden relay observation and signal recovery for rc5'
          git push origin HEAD:fix/skbhds-rc4-recovery-followup
