name: Apply SKBHDS RC5 recovery patch on PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'fix/skbhds-rc4-recovery-followup' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/skbhds-rc4-recovery-followup
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Extract and apply the fail-closed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/apply-skbhds-rc5-fix.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          body = []
          for line in src[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_rc5.py').write_text('\n'.join(body) + '\n')
          PY
          python3 /tmp/apply_rc5.py
      - name: Diff checks
        run: |
          git diff --check
          grep -q "versionCode 27" app/build.gradle
          grep -q "versionName '0.1.22-rc5'" app/build.gradle
          grep -q 'SIGNAL_RETRY_EXHAUSTED' app/src/main/java/com/shaterguy/chatgptpromptscheduler/OrchestrationService.java
          grep -q 'history_ready:false' app/src/main/java/com/shaterguy/chatgptpromptscheduler/OrchestrationScript.java
      - name: Unit tests
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Unsigned release build
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleRelease
      - name: Security screening
        shell: bash
        run: |
          set -euo pipefail
          git diff -- app/src/main app/build.gradle .github/workflows/rc-apk.yml > /tmp/rc5.diff
          ! grep -E 'BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,}' /tmp/rc5.diff
          test "$(git diff -- app/src/main/AndroidManifest.xml | wc -c)" -eq 0
      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-skbhds-rc5-fix.yml .github/workflows/apply-skbhds-rc5-fix-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden relay observation and signal recovery for rc5'
          git push origin HEAD:fix/skbhds-rc4-recovery-followup
