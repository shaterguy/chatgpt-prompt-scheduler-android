name: Apply SKBHDS RC5 recovery patch on PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'fix/skbhds-rc4-recovery-followup' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/skbhds-rc4-recovery-followup
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Extract and apply the fail-closed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-skbhds-rc5-fix.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = [line[10:] if line.startswith('          ') else line for line in source[start:end]]

          marker_hits = [i for i, line in enumerate(body)
                         if 'RESUME_ROOM_SCAN_META' in line and 'log(' in line]
          if len(marker_hits) != 1:
              raise SystemExit(f'expected one RESUME_ROOM_SCAN_META patch block, found {len(marker_hits)}')
          marker = marker_hits[0]
          call_start = marker
          while call_start >= 0 and not body[call_start].lstrip().startswith('replace(service,'):
              call_start -= 1
          if call_start < 0:
              raise SystemExit('could not find start of RESUME_ROOM_SCAN_META replace call')
          call_end = next((i for i in range(marker, len(body)) if body[i].strip() == "''')"), None)
          if call_end is None:
              raise SystemExit('could not find end of RESUME_ROOM_SCAN_META replace call')
          del body[call_start:call_end + 1]
          Path('/tmp/apply_rc5.py').write_text('\n'.join(body) + '\n')
          PY
          python3 /tmp/apply_rc5.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/shaterguy/chatgptpromptscheduler/OrchestrationService.java')
          lines = path.read_text().splitlines()
          if any('history_ready=' in line for line in lines):
              raise SystemExit('history_ready log marker already present unexpectedly')
          starts = [i for i, line in enumerate(lines) if 'log("RESUME_ROOM_SCAN_META", "side=" + safeCode(side)' in line]
          if len(starts) != 1:
              raise SystemExit(f'expected one RESUME_ROOM_SCAN_META log, found {len(starts)}')
          i = starts[0]
          lines.insert(i + 1, '                + ";history_ready=" + (result.optBoolean("history_ready", false) ? "1" : "0")')
          assistant = next((j for j in range(i + 2, min(i + 8, len(lines))) if ';assistant_turns=' in lines[j]), None)
          if assistant is None:
              raise SystemExit('assistant_turns line not found near RESUME_ROOM_SCAN_META')
          lines.insert(assistant + 1, '                + ";job_prompt_turns=" + Math.max(0, result.optInt("job_prompt_turns", 0))')
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Diff checks
        run: |
          git diff --check
          grep -q "versionCode 27" app/build.gradle
          grep -q "versionName '0.1.22-rc5'" app/build.gradle
          grep -q 'SIGNAL_RETRY_EXHAUSTED' app/src/main/java/com/shaterguy/chatgptpromptscheduler/OrchestrationService.java
          grep -q 'history_ready:false' app/src/main/java/com/shaterguy/chatgptpromptscheduler/OrchestrationScript.java
          grep -q 'history_ready=' app/src/main/java/com/shaterguy/chatgptpromptscheduler/OrchestrationService.java
      - name: Unit tests
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Unsigned release build
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleRelease
      - name: Security screening
        shell: bash
        run: |
          set -euo pipefail
          git diff -- app/src/main app/build.gradle .github/workflows/rc-apk.yml > /tmp/rc5.diff
          ! grep -E 'BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,}' /tmp/rc5.diff
          test "$(git diff -- app/src/main/AndroidManifest.xml | wc -c)" -eq 0
      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-skbhds-rc5-fix.yml .github/workflows/apply-skbhds-rc5-fix-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden relay observation and signal recovery for rc5'
          git push origin HEAD:fix/skbhds-rc4-recovery-followup
