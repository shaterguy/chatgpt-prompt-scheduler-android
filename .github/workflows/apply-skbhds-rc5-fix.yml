name: Apply SKBHDS RC5 recovery patch

on:
  push:
    branches:
      - fix/skbhds-rc4-recovery-followup

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/skbhds-rc4-recovery-followup
          fetch-depth: 0
      - name: Apply source patch
        run: |
          sed -i 's/Files\.readString(path, StandardCharsets\.UTF_8)/new String(Files.readAllBytes(path), StandardCharsets.UTF_8)/' .github/rc5_patch.py
          python3 -m py_compile .github/rc5_patch.py
          python3 .github/rc5_patch.py
          git diff --check
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest
      - name: Unsigned release build
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleRelease
      - name: Commit verified RC5 source
        run: |
          rm -f .github/rc5_patch.py .github/rc5-apply-failure.txt
          rm -f .github/workflows/apply-skbhds-rc5-fix.yml .github/workflows/apply-skbhds-rc5-fix-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden relay observation and signal recovery for rc5'
          git push origin HEAD:fix/skbhds-rc4-recovery-followup
