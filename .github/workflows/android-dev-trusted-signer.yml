name: Sign GPT Prompt Scheduler DEV APK
run-name: Trusted DEV signer for run ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - Build GPT Prompt Scheduler DEV APK
    types:
      - completed
    branches:
      - 'v0.3.0-dev*'

permissions:
  contents: read
  actions: read

env:
  TRUSTED_REPOSITORY_ID: '1325378971'
  TRUSTED_ACTOR: shaterguy
  TRUSTED_ACTOR_ID: '108107617'
  SOURCE_WORKFLOW_PATH: .github/workflows/android-dev.yml
  DEV_PACKAGE: com.shaterguy.chatgptpromptscheduler.dev
  DEV_APP_LABEL: ChatGPT Prompt Scheduler DEV
  EXPECTED_PUBLIC_CERT_SHA256: 3cfe95acd09077a89cd8de85434cbd5d8bb3e2021d8e9eacb804a8da9ccce52a
  MAX_ARCHIVE_BYTES: '30000000'
  MAX_APK_BYTES: '25000000'

concurrency:
  group: trusted-dev-signer-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  sign-dev:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools build-tools;36.0.0'

      - name: Validate trusted source run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          RUN_JSON="$RUNNER_TEMP/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUN_JSON"
          [[ "$(jq -r '.repository.id' "$RUN_JSON")" == "$TRUSTED_REPOSITORY_ID" ]]
          [[ "$(jq -r '.head_repository.id' "$RUN_JSON")" == "$TRUSTED_REPOSITORY_ID" ]]
          [[ "$(jq -r '.event' "$RUN_JSON")" == 'push' ]]
          [[ "$(jq -r '.path' "$RUN_JSON")" == "$SOURCE_WORKFLOW_PATH" ]]
          [[ "$(jq -r '.conclusion' "$RUN_JSON")" == 'success' ]]
          [[ "$(jq -r '.actor.login' "$RUN_JSON")" == "$TRUSTED_ACTOR" ]]
          [[ "$(jq -r '.actor.id' "$RUN_JSON")" == "$TRUSTED_ACTOR_ID" ]]
          [[ "$(jq -r '.triggering_actor.login' "$RUN_JSON")" == "$TRUSTED_ACTOR" ]]
          [[ "$(jq -r '.triggering_actor.id' "$RUN_JSON")" == "$TRUSTED_ACTOR_ID" ]]

          HEAD_BRANCH="$(jq -r '.head_branch' "$RUN_JSON")"
          HEAD_SHA="$(jq -r '.head_sha' "$RUN_JSON")"
          [[ "$HEAD_BRANCH" =~ ^v0\.3\.0-dev([1-9][0-9]*)$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          DEV_NUMBER="${BASH_REMATCH[1]}"
          VERSION_NAME="${HEAD_BRANCH#v}"
          VERSION_CODE="$((3000000 + DEV_NUMBER))"
          EXPECTED_ARTIFACT="chatgpt-prompt-scheduler-dev-${VERSION_NAME}-unsigned"
          UNSIGNED_NAME="chatgpt-prompt-scheduler-dev-v${VERSION_NAME}-unsigned.apk"
          SIGNED_NAME="chatgpt-prompt-scheduler-dev-v${VERSION_NAME}.apk"
          CURRENT_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$HEAD_BRANCH" --jq '.object.sha')"
          [[ "$CURRENT_SHA" == "$HEAD_SHA" ]]

          printf 'head_branch=%s\n' "$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'version_name=%s\n' "$VERSION_NAME" >> "$GITHUB_OUTPUT"
          printf 'version_code=%s\n' "$VERSION_CODE" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "$EXPECTED_ARTIFACT" >> "$GITHUB_OUTPUT"
          printf 'unsigned_name=%s\n' "$UNSIGNED_NAME" >> "$GITHUB_OUTPUT"
          printf 'signed_name=%s\n' "$SIGNED_NAME" >> "$GITHUB_OUTPUT"

      - name: Download and verify exact source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_BRANCH: ${{ steps.source.outputs.head_branch }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          EXPECTED_ARTIFACT: ${{ steps.source.outputs.artifact_name }}
          UNSIGNED_NAME: ${{ steps.source.outputs.unsigned_name }}
        run: |
          set -euo pipefail
          ARTIFACTS_JSON="$RUNNER_TEMP/source-artifacts.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > "$ARTIFACTS_JSON"
          COUNT="$(jq --arg name "$EXPECTED_ARTIFACT" '[.artifacts[] | select(.name == $name and (.expired | not))] | length' "$ARTIFACTS_JSON")"
          [[ "$COUNT" == '1' ]]
          ARTIFACT_ID="$(jq -r --arg name "$EXPECTED_ARTIFACT" '.artifacts[] | select(.name == $name and (.expired | not)) | .id' "$ARTIFACTS_JSON")"
          DIGEST="$(jq -r --arg name "$EXPECTED_ARTIFACT" '.artifacts[] | select(.name == $name and (.expired | not)) | .digest' "$ARTIFACTS_JSON")"
          META_REPO_ID="$(jq -r --arg name "$EXPECTED_ARTIFACT" '.artifacts[] | select(.name == $name and (.expired | not)) | .workflow_run.repository_id' "$ARTIFACTS_JSON")"
          META_HEAD_REPO_ID="$(jq -r --arg name "$EXPECTED_ARTIFACT" '.artifacts[] | select(.name == $name and (.expired | not)) | .workflow_run.head_repository_id' "$ARTIFACTS_JSON")"
          META_BRANCH="$(jq -r --arg name "$EXPECTED_ARTIFACT" '.artifacts[] | select(.name == $name and (.expired | not)) | .workflow_run.head_branch' "$ARTIFACTS_JSON")"
          META_SHA="$(jq -r --arg name "$EXPECTED_ARTIFACT" '.artifacts[] | select(.name == $name and (.expired | not)) | .workflow_run.head_sha' "$ARTIFACTS_JSON")"
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$META_REPO_ID" == "$TRUSTED_REPOSITORY_ID" ]]
          [[ "$META_HEAD_REPO_ID" == "$TRUSTED_REPOSITORY_ID" ]]
          [[ "$META_BRANCH" == "$HEAD_BRANCH" ]]
          [[ "$META_SHA" == "$HEAD_SHA" ]]

          ARCHIVE="$RUNNER_TEMP/dev-artifact.zip"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$ARCHIVE"
          test -s "$ARCHIVE"
          [[ "$(stat -c '%s' "$ARCHIVE")" -le "$MAX_ARCHIVE_BYTES" ]]
          [[ "sha256:$(sha256sum "$ARCHIVE" | awk '{print $1}')" == "$DIGEST" ]]

          EXTRACT_DIR="$RUNNER_TEMP/dev-candidate"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          python3 - "$ARCHIVE" "$EXTRACT_DIR" "$UNSIGNED_NAME" "$MAX_APK_BYTES" <<'PY'
          import pathlib, stat, sys, zipfile
          archive, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          apk_name, max_apk = sys.argv[3], int(sys.argv[4])
          expected = {apk_name, 'UNSIGNED_SHA256SUMS.txt', 'SOURCE_COMMIT.txt'}
          with zipfile.ZipFile(archive) as zf:
              infos = [i for i in zf.infolist() if not i.is_dir()]
              names = {i.filename for i in infos}
              if names != expected or len(infos) != 3:
                  raise SystemExit(f'unexpected artifact members: {sorted(names)}')
              total = 0
              for info in infos:
                  path = pathlib.PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts or len(path.parts) != 1:
                      raise SystemExit(f'unsafe artifact path: {info.filename}')
                  if ((info.external_attr >> 16) & 0o170000) == stat.S_IFLNK:
                      raise SystemExit(f'symlink forbidden: {info.filename}')
                  limit = max_apk if info.filename == apk_name else 4096
                  if info.file_size < 1 or info.file_size > limit:
                      raise SystemExit(f'invalid member size: {info.filename}={info.file_size}')
                  total += info.file_size
              if total > max_apk + 8192:
                  raise SystemExit('artifact expanded size too large')
              for info in infos:
                  target = out / info.filename
                  with zf.open(info) as src, target.open('wb') as dst:
                      while chunk := src.read(1024 * 1024):
                          dst.write(chunk)
          PY

          SOURCE_FILE="$EXTRACT_DIR/SOURCE_COMMIT.txt"
          SUM_FILE="$EXTRACT_DIR/UNSIGNED_SHA256SUMS.txt"
          APK="$EXTRACT_DIR/$UNSIGNED_NAME"
          [[ "$(tr -d '[:space:]' < "$SOURCE_FILE")" == "$HEAD_SHA" ]]
          [[ "$(wc -l < "$SUM_FILE" | tr -d '[:space:]')" == '1' ]]
          EXPECTED_APK_SHA="$(awk '{print $1}' "$SUM_FILE")"
          CHECKSUM_NAME="$(awk '{print $2}' "$SUM_FILE")"
          CHECKSUM_NAME="${CHECKSUM_NAME#\*}"
          [[ "$EXPECTED_APK_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CHECKSUM_NAME" == "$UNSIGNED_NAME" ]]
          [[ "$(sha256sum "$APK" | awk '{print $1}')" == "$EXPECTED_APK_SHA" ]]
          unzip -t "$APK" >/dev/null

      - name: Validate unsigned APK manifest allowlist
        shell: bash
        env:
          VERSION_NAME: ${{ steps.source.outputs.version_name }}
          VERSION_CODE: ${{ steps.source.outputs.version_code }}
          UNSIGNED_NAME: ${{ steps.source.outputs.unsigned_name }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/dev-candidate/$UNSIGNED_NAME"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          PREFLIGHT="$RUNNER_TEMP/dev-preflight"
          rm -rf "$PREFLIGHT"
          mkdir -p "$PREFLIGHT"
          "$BT/aapt" dump badging "$APK" > "$PREFLIGHT/APK_BADGING.txt"
          "$BT/aapt" dump permissions "$APK" > "$PREFLIGHT/APK_PERMISSIONS.txt"
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml > "$PREFLIGHT/APK_MANIFEST.txt"

          python3 - "$PREFLIGHT/APK_BADGING.txt" "$PREFLIGHT/APK_MANIFEST.txt" "$VERSION_NAME" "$VERSION_CODE" "$DEV_PACKAGE" "$DEV_APP_LABEL" <<'PY'
          import re, sys
          badging = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          tree = open(sys.argv[2], encoding='utf-8', errors='replace').read().splitlines()
          version_name, version_code, package_name, app_label = sys.argv[3:7]
          pkg = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging, re.M)
          if not pkg or pkg.groups() != (package_name, version_code, version_name):
              raise SystemExit('package/version mismatch')
          if f"application-label:'{app_label}'" not in badging:
              raise SystemExit('application label mismatch')
          expected_permissions = {
              'android.permission.INTERNET', 'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.WAKE_LOCK', 'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_SPECIAL_USE',
              'android.permission.POST_NOTIFICATIONS',
          }
          actual_permissions = set(re.findall(r"^uses-permission(?:-sdk-\d+)?: name='([^']+)'", badging, re.M))
          if actual_permissions != expected_permissions:
              raise SystemExit(f'permission allowlist mismatch: {sorted(actual_permissions)}')
          joined = '\n'.join(tree)
          for tag in ('permission', 'permission-group', 'permission-tree', 'instrumentation', 'provider'):
              if re.search(rf'^\s*E: {re.escape(tag)}\b', joined, re.M):
                  raise SystemExit(f'forbidden manifest element: {tag}')
          if 'android:sharedUserId' in joined or re.search(r'android:protectionLevel.*(?:signature|knownSigner)', joined, re.I):
              raise SystemExit('forbidden same-signature trust construct')
          expected = {
              'activity': {'.SettingsActivity': False, '.LogsActivity': False, '.LoginActivity': False,
                           '.ScheduleEditorActivity': False, '.OrchestrationActivity': False, '.MainActivity': True},
              'receiver': {'.AlarmReceiver': False, '.BootReceiver': False},
              'service': {'.ExecutionService': False, '.OrchestrationService': False},
          }
          found = {k: {} for k in expected}
          current = None
          current_indent = -1
          attrs = {}
          children_started = False

          def commit_component(tag, values):
              if tag is None:
                  return
              name, exported = values.get('name'), values.get('exported')
              if name is None or exported is None:
                  raise SystemExit(f'missing component attributes for {tag}: {values}')
              if name in found[tag]:
                  raise SystemExit(f'duplicate component: {tag} {name}')
              found[tag][name] = exported

          for line in tree:
              elem = re.match(r'^(\s*)E: ([\w.-]+)\b', line)
              if elem:
                  indent, tag = len(elem.group(1)), elem.group(2)
                  if current is not None and indent <= current_indent:
                      commit_component(current, attrs)
                      current, attrs, children_started = None, {}, False
                  elif current is not None and indent > current_indent:
                      children_started = True
                  if tag in expected:
                      if current is not None:
                          commit_component(current, attrs)
                      current, current_indent, attrs, children_started = tag, indent, {}, False
                  continue
              if current is None or children_started:
                  continue
              attr = re.match(r'^\s*A: android:([^\s(=]+).*', line)
              if not attr:
                  continue
              key = attr.group(1)
              if key == 'name':
                  raw = re.search(r'\(Raw: "([^"]+)"\)', line) or re.search(r'="([^"]+)"', line)
                  if raw:
                      attrs['name'] = raw.group(1)
              elif key == 'exported':
                  val = re.search(r'\(type 0x12\)0x([0-9a-fA-F]+)', line)
                  if val:
                      attrs['exported'] = int(val.group(1), 16) != 0
          if current is not None:
              commit_component(current, attrs)
          if found != expected:
              raise SystemExit(f'component/export allowlist mismatch: {found}')
          PY

      - name: Sign with persistent trusted identity
        shell: bash
        env:
          SIGNING_BUNDLE_BASE64: ${{ secrets.CHATGPT_PUBLIC_SIGNING_BUNDLE_BASE64 }}
          UNSIGNED_NAME: ${{ steps.source.outputs.unsigned_name }}
          SIGNED_NAME: ${{ steps.source.outputs.signed_name }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_BUNDLE_BASE64"
          umask 077
          WORK="$RUNNER_TEMP/trusted-dev-signing"
          cleanup() { rm -rf "$WORK"; }
          trap cleanup EXIT HUP INT TERM
          rm -rf "$WORK"
          mkdir -p "$WORK" signed-output
          printf '%s' "$SIGNING_BUNDLE_BASE64" | base64 --decode > "$WORK/bundle.tar.gz"
          mapfile -t MEMBERS < <(tar -tzf "$WORK/bundle.tar.gz")
          [[ "${#MEMBERS[@]}" -eq 2 ]]
          printf '%s\n' "${MEMBERS[@]}" | grep -Fxq 'key.pk8'
          printf '%s\n' "${MEMBERS[@]}" | grep -Fxq 'cert.pem'
          if printf '%s\n' "${MEMBERS[@]}" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then exit 1; fi
          tar -xzf "$WORK/bundle.tar.gz" -C "$WORK" --no-same-owner --no-same-permissions
          test -s "$WORK/key.pk8"; test -s "$WORK/cert.pem"
          ACTUAL_CERT="$(openssl x509 -in "$WORK/cert.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          [[ "$ACTUAL_CERT" == "$EXPECTED_PUBLIC_CERT_SHA256" ]]
          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="$RUNNER_TEMP/dev-candidate/$UNSIGNED_NAME"
          ALIGNED="$WORK/aligned.apk"
          APK="signed-output/$SIGNED_NAME"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" >/dev/null
          "$BT/apksigner" sign --key "$WORK/key.pk8" --cert "$WORK/cert.pem" --out "$APK" "$ALIGNED"
          test -s "$APK"

      - name: Verify signed DEV artifact after secret cleanup
        shell: bash
        env:
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          VERSION_NAME: ${{ steps.source.outputs.version_name }}
          VERSION_CODE: ${{ steps.source.outputs.version_code }}
          SIGNED_NAME: ${{ steps.source.outputs.signed_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK="signed-output/$SIGNED_NAME"
          PREFLIGHT="$RUNNER_TEMP/dev-preflight"
          test -s "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > signed-output/APK_CERT.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' signed-output/APK_CERT.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' signed-output/APK_CERT.txt
          CERT_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' signed-output/APK_CERT.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$CERT_SHA256" == "$EXPECTED_PUBLIC_CERT_SHA256" ]]
          printf '%s\n' "$CERT_SHA256" > signed-output/DEV_SIGNING_CERT_SHA256.txt
          "$BT/aapt" dump badging "$APK" > signed-output/APK_BADGING.txt
          "$BT/aapt" dump permissions "$APK" > signed-output/APK_PERMISSIONS.txt
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml > signed-output/APK_MANIFEST.txt
          cmp -s "$PREFLIGHT/APK_BADGING.txt" signed-output/APK_BADGING.txt
          cmp -s "$PREFLIGHT/APK_PERMISSIONS.txt" signed-output/APK_PERMISSIONS.txt
          cmp -s "$PREFLIGHT/APK_MANIFEST.txt" signed-output/APK_MANIFEST.txt
          grep -Fq "package: name='$DEV_PACKAGE'" signed-output/APK_BADGING.txt
          grep -Fq "versionCode='$VERSION_CODE'" signed-output/APK_BADGING.txt
          grep -Fq "versionName='$VERSION_NAME'" signed-output/APK_BADGING.txt
          grep -Fq "application-label:'$DEV_APP_LABEL'" signed-output/APK_BADGING.txt
          "$BT/zipalign" -c -v 4 "$APK" > signed-output/ZIPALIGN_VERIFY.txt
          unzip -t "$APK" >/dev/null
          (cd signed-output && sha256sum "$SIGNED_NAME" > SHA256SUMS.txt)
          printf '%s\n' "$HEAD_SHA" > signed-output/SOURCE_COMMIT.txt
          printf '%s\n' "$SOURCE_RUN_ID" > signed-output/SOURCE_RUN_ID.txt

      - name: Upload signed DEV APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-prompt-scheduler-dev-${{ steps.source.outputs.version_name }}-signed
          path: signed-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30